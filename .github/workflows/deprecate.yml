name: Deprecate

# Mark an npm package (or a range) as deprecated. Used to point the old
# @clearsoft/easysql-sdk package at the new @easysql/client packages.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Package or package@range to deprecate"
        required: true
        default: "@clearsoft/easysql-sdk"
      message:
        description: "Deprecation message"
        required: true
        default: "Renamed: use @easysql/client instead. This package is no longer maintained."

permissions:
  contents: read

jobs:
  deprecate:
    name: npm deprecate
    runs-on: ubuntu-latest

    steps:
      - name: Configure npm auth
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          echo "userconfig: $(npm config get userconfig)"
          echo "registry: $(npm config get registry)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Diagnose the token
        run: |
          echo "whoami: $(npm whoami 2>&1)"
          echo "--- packages this token can access ---"
          npm access list packages 2>&1 | head -50 || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deprecate ${{ inputs.spec }}
        run: npm deprecate "$SPEC" "$MESSAGE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SPEC: ${{ inputs.spec }}
          MESSAGE: ${{ inputs.message }}
